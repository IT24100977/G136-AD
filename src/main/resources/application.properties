server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/fare_payment_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Must be identical across all four services. No default on purpose.
app.jwt.secret=${JWT_SECRET:this-is-a-temporary-dev-secret-must-match-all-four-services-change-me}

# Documented fare rule (LKR, simulated)
app.fare.currency=LKR
app.fare.base-fare=100
app.fare.per-km=60
app.fare.per-minute=5
app.fare.minimum-fare=250
app.fare.average-speed-kmh=30

# Simulated payment: amounts above this limit are declined (lower it to demonstrate a failed payment)
app.payment.max-amount=${PAYMENT_MAX_AMOUNT:50000}
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/account_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:this-is-a-temporary-dev-secret-must-match-all-four-services-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
